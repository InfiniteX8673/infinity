<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Generator — Charlton</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <script src="scripts.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <nav>
    <a class="logo" href="index.html">Charlton</a>
    <ul class="nav-links">
      <li><a href="index.html">Work</a></li>
      <li><a href="comps.html">Projects</a></li>
      <li><a href="report.html" class="active">Tools</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <a class="back-link" href="index.html">&larr; Back</a>
      <h1>School Report Generator</h1>
      <p>Create student report cards and export as PDF.</p>
    </div>

    <section class="student-info">
      <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student name" required>
      </div>
      <div class="form-group">
        <label for="system">Grading System</label>
        <select id="system">
          <option value="zimsec">ZIMSEC</option>
          <option value="cambridge">Cambridge</option>
        </select>
      </div>
    </section>

    <section class="subjects-section">
      <div class="section-label" style="margin-top: 32px;">Subjects</div>
      <table class="subject-table">
        <thead>
          <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="subjects"></tbody>
      </table>

      <div class="total-score">
        <label for="Total">Total</label>
        <input type="text" id="Total" readonly>
      </div>

      <div class="button-group">
        <button type="button" onclick="addSubject()">Add Subject</button>
        <button type="button" onclick="clearReport()">Clear</button>
        <button type="button" onclick="generateReport()">Generate Report</button>
      </div>
    </section>

    <section id="report" class="hidden">
      <div class="section-label" style="margin-top: 32px;">Generated Report</div>
      <p>Report for: <strong><span id="reportName"></span></strong></p>

      <table id="reportTable">
        <thead>
          <tr>
            <th>Subject</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>

      <div class="download-button">
        <button type="button" onclick="downloadPDF()">Download PDF</button>
      </div>
    </section>
  </div>

  <footer>&copy; 2025 Charlton</footer>
</body>
</html>
