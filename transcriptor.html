<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transcription Tool — Charlton</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="offlineBanner">You are offline. Speech recognition requires an internet connection.</div>

  <nav>
    <a class="logo" href="index.html">Charlton</a>
    <ul class="nav-links">
      <li><a href="index.html">Work</a></li>
      <li><a href="comps.html">Projects</a></li>
      <li><a href="report.html" class="active">Tools</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <a class="back-link" href="index.html">&larr; Back</a>
      <h1>Live Transcription</h1>
      <p>Real-time voice-to-text using the Web Speech API.</p>
    </div>

    <div class="controls">
      <button onclick="startListening()">Start</button>
      <button onclick="stopListening()">Stop</button>
      <button onclick="clearTranscript()">Clear</button>
      <button onclick="downloadTranscriptPDF()">Download PDF</button>

      <select id="langSelect">
        <option value="en-US">English</option>
        <option value="fr-FR">French</option>
        <option value="es-ES">Spanish</option>
        <option value="de-DE">German</option>
      </select>

      <label>
        <input type="checkbox" id="showTime" checked />
        Timestamps
      </label>
    </div>

    <div id="transcript"></div>

    <div class="status-indicator" id="statusIndicator" style="display: none;">
      <div class="mic-dot"></div>
      <span>Listening...</span>
    </div>
  </div>

  <footer>&copy; 2025 Charlton</footer>

  <script>
    let recognition;
    let isListening = false;

    function updateOnlineStatus() {
      const banner = document.getElementById('offlineBanner');
      if (!navigator.onLine) {
        banner.style.display = 'block';
        stopListening();
      } else {
        banner.style.display = 'none';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    function startListening() {
      if (!navigator.onLine) {
        alert("You are offline. Connect to the internet for speech recognition.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = document.getElementById('langSelect').value;
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            transcript += event.results[i][0].transcript + '\n';
          }
        }

        if (transcript.trim()) {
          const showTime = document.getElementById('showTime').checked;
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const output = showTime ? `[${time}] ${transcript}` : transcript;
          const tElem = document.getElementById('transcript');
          tElem.innerText += output;
          tElem.scrollTop = tElem.scrollHeight;
        }
      };

      recognition.onerror = function(event) {
        console.error("Speech recognition error:", event.error);
      };

      recognition.onend = function () {
        if (isListening) {
          recognition.start();
        }
      };

      recognition.start();
      isListening = true;
      document.getElementById('statusIndicator').style.display = 'flex';
    }

    function stopListening() {
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
        document.getElementById('statusIndicator').style.display = 'none';
      }
    }

    function clearTranscript() {
      document.getElementById('transcript').innerText = '';
    }

    async function downloadTranscriptPDF() {
      const rawText = document.getElementById('transcript').innerText;
      const lines = rawText.trim().split("\n").filter(line => line.trim() !== "");

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      let y = 10;

      doc.setFont("Courier", "normal");
      doc.setFontSize(12);
      lines.forEach((line) => {
        if (y > 280) {
          doc.addPage();
          y = 10;
        }
        doc.text(line, 10, y);
        y += 7;
      });

      const fileName = `Transcript_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.pdf`;
      doc.save(fileName);
    }
  </script>
</body>
</html>
